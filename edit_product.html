<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">📦 Inventory Management</div>
    <div class="admin">👤 Admin</div>
</header>

<div class="container">

    <aside>

        <h2>MENU</h2>

        <a href="/">📊 Dashboard</a>
        <a href="/products-page">📦 Products</a>
        <a href="/categories-page">🏷️ Categories</a>
        <a href="/suppliers-page">🚚 Suppliers</a>
        <a href="/customers-page">👥 Customers</a>
        <a href="/stock-in-page">📥 Stock In</a>
        <a href="/stock-out-page">📤 Stock Out</a>
        <a href="/purchases-page">🛒 Purchases</a>
        <a href="/sales-page">💰 Sales</a>
        <a href="/transactions-page">📋 Transactions</a>

    </aside>


    <main>

        <h1>Edit Product</h1>

        <p class="welcome">
            Update product information
        </p>


        <div class="product-section">

            <form method="POST">

                <label>Product Name</label>

                <input
                    type="text"
                    name="product_name"
                    value="{{ product.product_name }}"
                    required
                >


                <label>Category ID</label>

                <input
                    type="number"
                    name="category_id"
                    value="{{ product.category_id }}"
                    min="1"
                    required
                >


                <label>Supplier ID</label>

                <input
                    type="number"
                    name="supplier_id"
                    value="{{ product.supplier_id }}"
                    min="1"
                    required
                >


                <label>Price</label>

                <input
                    type="number"
                    name="price"
                    value="{{ product.price }}"
                    min="0"
                    step="0.01"
                    required
                >


                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    value="{{ product.quantity }}"
                    min="0"
                    required
                >


                <label>Reorder Level</label>

                <input
                    type="number"
                    name="reorder_level"
                    value="{{ product.reorder_level }}"
                    min="0"
                    required
                >


                <button type="submit">
                    💾 Update Product
                </button>

                <a href="/products-page">
                    <button type="button">
                        Cancel
                    </button>
                </a>

            </form>

        </div>

    </main>

</div>

</body>
</html>
