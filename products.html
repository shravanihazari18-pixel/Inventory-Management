<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Inventory Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">
        📦 Inventory Management
    </div>

    <div class="admin">
        👤 Admin
    </div>

</header>


<div class="container">

    <aside>

        <h2>MENU</h2>

        <a href="/">📊 Dashboard</a>

        <a href="/products-page" class="active">
            📦 Products
        </a>

        <a href="/categories-page">🏷️ Categories</a>

        <a href="/suppliers-page">🚚 Suppliers</a>

        <a href="/customers-page">👥 Customers</a>

        <a href="/stock-in-page">📥 Stock In</a>

        <a href="/stock-out-page">📤 Stock Out</a>

        <a href="/purchases-page">🛒 Purchases</a>

        <a href="/sales-page">💰 Sales</a>

        <a href="/transactions-page">📋 Transactions</a>

    </aside>


    <main>

        <h1>Products</h1>

        <p class="welcome">
            Manage your inventory products
        </p>


        <div class="product-section">

            <div class="section-header">

                <h2>Product List</h2>

                <div>

                    <input
                        type="text"
                        id="searchBox"
                        placeholder="Search products..."
                        onkeyup="searchProducts()"
                    >

                    <a href="/add-product">
                        <button type="button">+ Add Product</button>
                    </a>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Supplier</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Reorder Level</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="productTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

let allProducts = [];


fetch("/products")

.then(response => response.json())

.then(data => {

    allProducts = data;

    displayProducts(data);

})


.catch(error => {

    console.error("Error loading products:", error);

});


function displayProducts(products) {

    const table =
        document.getElementById("productTable");

    table.innerHTML = "";


    products.forEach(product => {

        table.innerHTML += `
    <tr>
        <td>${product.product_id}</td>
        <td>${product.product_name}</td>
        <td>${product.category_id}</td>
        <td>${product.supplier_id}</td>
        <td>₹${product.price}</td>
        <td>${product.quantity}</td>
        <td>${product.reorder_level}</td>

        <td>
            <a href="/edit-product/${product.product_id}">
    <button type="button">✏️ Edit</button>
</a>

<a href="/delete-product/${product.product_id}"
   onclick="return confirm('Are you sure you want to delete this product?');">
    <button type="button">🗑️ Delete</button>
</a>
        </td>
    </tr>
`;

    });

}


function searchProducts() {

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase();


    const filteredProducts =
        allProducts.filter(product =>

            product.product_name
            .toLowerCase()
            .includes(search)

        );


    displayProducts(filteredProducts);

}

</script>

</body>

</html>
